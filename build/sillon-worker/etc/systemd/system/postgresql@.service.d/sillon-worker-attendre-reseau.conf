[Service]
# Voir /opt/sillon-worker/attendre_reseau.sh : évite un listen_addresses
# partiellement lié (localhost seul) si PostgreSQL démarre avant que
# l'interface réseau de l'hôte ait obtenu son adresse (cas d'une VM en
# DHCP sur une interface "allow-hotplug", où network-online.target ne
# suffit pas à garantir l'ordre - constaté en pratique).
#
# Cible le service gabarit "postgresql@.service" (instancié en
# "postgresql@<version>-main.service"), pas "postgresql.service" - ce
# dernier est une unité factice sur Debian (ExecStart=/bin/true,
# RemainAfterExit=on, cf. son commentaire d'en-tête officiel) qui ne
# démarre jamais réellement PostgreSQL : un premier drop-in posé dessus
# par erreur n'avait donc aucun effet (constaté en pratique, un
# redémarrage de test échouait encore malgré le correctif).
ExecStartPre=/opt/sillon-worker/attendre_reseau.sh
